<meta property="og:site_name" content="Reno Research" />

<title>Renovation project | Reno Research</title>
<meta name="description" content="View this renovation project on Reno Research." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26263C; --ink-2:#1B1B2E; --ink-soft:#3A3A52;
  --gold:#E8A41E; --gold-deep:#C2861A; --gold-soft:#F6E2B6;
  --cream:#ECE7E1; --cream-soft:#F7F3ED; --paper:#FFFFFF;
  --muted:#5E5E72; --line:#E5DFD6; --ok:#1F9D6B;
  --shadow:0 18px 50px -24px rgba(31,31,52,.45);
  --shadow-sm:0 8px 24px -16px rgba(31,31,52,.5);
  --r:16px; --r-lg:22px; --r-sm:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream-soft);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1160px,92vw);margin-inline:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font-weight:700;font-size:.95rem;
  padding:.85rem 1.5rem;border-radius:999px;cursor:pointer;border:none;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease;}
.btn-gold{background:var(--gold);color:var(--ink-2);box-shadow:0 10px 22px -10px rgba(232,164,30,.7)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 28px -10px rgba(232,164,30,.75)}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-deep)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- APP BAR ---------- */
.appbar{position:sticky;top:0;z-index:60;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.06);}
.appbar .inner{display:flex;align-items:center;gap:1.4rem;height:74px}
.brand{display:flex;align-items:center;gap:.7rem;margin-right:auto}
.brand .chip{width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--gold),#F4C24B);
  display:grid;place-items:center;flex:none;font-family:"Fraunces",serif;font-weight:700;color:var(--ink-2);font-size:1.4rem}
.brand .name{display:flex;flex-direction:column;line-height:1}
.brand .name b{font-family:"Fraunces",serif;color:#fff;font-size:1.18rem;font-weight:600;letter-spacing:.01em}
.brand .name span{color:var(--gold);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:1.7rem;align-items:center}
.nav a{color:#D7D7E2;font-weight:500;font-size:.92rem;position:relative;padding:.3rem 0}
.nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--gold);transition:width .2s}
.nav a:hover,.nav a.active{color:#fff}.nav a:hover::after,.nav a.active::after{width:100%}
.menu-btn{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:.4rem}

/* ---------- BREADCRUMB ---------- */
.crumbs{padding:1.4rem 0 0;font-size:.84rem;color:var(--muted);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.crumbs a:hover{color:var(--gold-deep)}
.crumbs .sep{opacity:.5}

/* ---------- PROJECT ---------- */
.project{padding:1.2rem 0 4rem}
.phead{margin-bottom:1.4rem}
.type-badge{display:inline-block;background:var(--ink);color:#fff;font-size:.7rem;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;padding:.3rem .65rem;border-radius:7px;margin-bottom:.7rem}
.project h1{font-size:clamp(1.8rem,4vw,2.7rem);margin-bottom:.5rem;max-width:24ch}
.firmline{display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:.95rem}
.firmline a{color:var(--gold-deep);font-weight:600}

/* ---------- GALLERY ---------- */
.gallery{display:grid;gap:.7rem;margin-bottom:1.8rem}
.gmain{position:relative;aspect-ratio:16/10;border-radius:var(--r-lg);overflow:hidden;background:var(--cream);box-shadow:var(--shadow-sm)}
.gmain img{width:100%;height:100%;object-fit:cover}
.gmain .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--gold-deep);background:linear-gradient(150deg,#FBF1D9,#F4EFE7)}
.gthumbs{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.3rem}
.gthumbs img{width:96px;height:72px;border-radius:10px;object-fit:cover;flex:none;cursor:pointer;
  border:2px solid transparent;transition:border-color .15s,transform .15s}
.gthumbs img:hover{transform:translateY(-2px)}
.gthumbs img.active{border-color:var(--gold)}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:1fr 320px;gap:2rem;align-items:start}
.section{margin-bottom:1.8rem}
.section h2{font-size:1.3rem;margin-bottom:.7rem}
.desc{color:var(--ink-soft);font-size:1.04rem;line-height:1.8;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.4rem}
.chip-tag{font-size:.74rem;font-weight:600;padding:.3rem .65rem;border-radius:999px;background:var(--cream-soft);
  border:1px solid var(--line);color:var(--ink-soft)}
.chip-tag.theme{background:#FBF1D9;border-color:var(--gold-soft);color:var(--gold-deep)}

/* ---------- SIDEBAR ---------- */
.aside{position:sticky;top:94px;display:flex;flex-direction:column;gap:1rem}
.specs{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.spec-row{display:flex;justify-content:space-between;gap:1rem;padding:.85rem 1.1rem;border-bottom:1px solid var(--line);font-size:.92rem}
.spec-row:last-child{border-bottom:none}
.spec-row .k{color:var(--muted)}
.spec-row .v{font-weight:700;text-align:right;color:var(--ink)}
.spec-row .v.cost{font-family:"Fraunces",serif;color:var(--gold-deep);font-size:1.05rem}
.sidecta{background:linear-gradient(150deg,#FBF1D9,#F4EFE7);border:1px solid var(--gold-soft);
  border-radius:var(--r);padding:1.3rem;text-align:center}
.sidecta h3{font-size:1.15rem;margin-bottom:.4rem}
.sidecta p{color:var(--muted);font-size:.9rem;margin-bottom:1rem}

/* ---------- STATES ---------- */
.loading,.error{text-align:center;padding:5rem 1rem;color:var(--muted)}
.error h2{color:var(--ink);font-size:1.5rem;margin-bottom:.5rem}
.sk{background:var(--paper);border-radius:8px;height:14px;margin:.8rem 0;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(232,164,30,.1),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}

/* ---------- LIGHTBOX ---------- */
.lightbox{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
  background:rgba(15,15,26,.92);padding:2rem}
.lightbox.open{display:flex}
.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:8px}
.lightbox .lb-close{position:absolute;top:1.2rem;right:1.2rem;width:42px;height:42px;border-radius:50%;
  border:none;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  border:none;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:1.5rem}
.lightbox .lb-prev{left:1.2rem}.lightbox .lb-next{right:1.2rem}

@media (max-width:880px){ .layout{grid-template-columns:1fr} .aside{position:static} }
@media (max-width:760px){ .nav{display:none} .menu-btn{display:block} }
</style>
</head>
<body>

<!-- ===== APP BAR ===== -->
<header class="appbar">
  <div class="wrap inner">
    <a class="brand" href="index.html" aria-label="Reno Research home">
      <span class="chip">R</span>
      <span class="name"><b>Reno Research</b><span>Renovation matchmaking</span></span>
    </a>
    <nav class="nav">
      <a href="firms.html">Firms</a>
      <a href="portfolio.html" class="active">Portfolio</a>
      <a href="packages.html">Packages</a>
      <a href="events.html">Events</a>
      <a href="blogs.html">Guides</a>
      <a href="loan.html">Loan</a>
    </nav>
    <a href="index.html#lead" class="btn btn-gold" style="padding:.65rem 1.2rem">Get matched</a>
    <button class="menu-btn" aria-label="Menu" onclick="document.querySelector('.nav').style.display=getComputedStyle(document.querySelector('.nav')).display==='flex'?'none':'flex'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="portfolio.html">Portfolio</a><span class="sep">/</span>
    <span id="crumbTitle">Project</span>
  </nav>
</main>

<section class="project">
  <div class="wrap" id="content">
    <div class="loading">
      <div class="sk" style="width:30%"></div>
      <div class="sk" style="width:70%;height:30px"></div>
      <div class="sk" style="width:100%;height:320px;margin-top:1.5rem"></div>
      <div class="sk" style="width:100%"></div>
      <div class="sk" style="width:90%"></div>
    </div>
  </div>
</section>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
</div>

<script>
const API = 'https://api.renoresearch.sg';
const params = new URLSearchParams(location.search);
const ID = params.get('id') || params.get('portfolioId');

let IMAGES = [];
let lbIndex = 0;

function esc(s){ return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function costText(c){
  if (!c) return '';
  if (typeof c === 'object') return c.displayText || (c.amount ? `${c.currency || 'SGD'} ${Number(c.amount).toLocaleString()}` : '');
  return c.toString();
}
function setMeta(name, val, attr='name'){
  let el = document.querySelector(`meta[${attr}="${name}"]`);
  if (!el){ el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
  el.setAttribute('content', val);
}

const elContent = document.getElementById('content');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');

function openLb(i){
  if (!IMAGES.length) return;
  lbIndex = (i + IMAGES.length) % IMAGES.length;
  lbImg.src = IMAGES[lbIndex];
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb(){ lightbox.classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', () => openLb(lbIndex - 1));
document.getElementById('lbNext').addEventListener('click', () => openLb(lbIndex + 1));
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') openLb(lbIndex - 1);
  if (e.key === 'ArrowRight') openLb(lbIndex + 1);
});

function showError(msg){
  elContent.innerHTML = `<div class="error">
    <h2>Project not found</h2>
    <p>${esc(msg)}</p>
    <a href="portfolio.html" class="btn btn-gold" style="margin-top:1.2rem">Browse all portfolios</a>
  </div>`;
}

function specRow(k, v, cls=''){ return v ? `<div class="spec-row"><span class="k">${esc(k)}</span><span class="v ${cls}">${esc(v)}</span></div>` : ''; }

async function load(){
  if (!ID){ showError('No project was specified.'); return; }
  try {
    const res = await fetch(`${API}/homeowner-portfolio/${encodeURIComponent(ID)}`, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const p = (await res.json()).data || {};

    IMAGES = (p.imageUrls || []).filter(Boolean);
    if (p.coverImage && !IMAGES.includes(p.coverImage)) IMAGES.unshift(p.coverImage);

    const type = p.renovationType || p.propertyType || '';
    const title = (p.title || '').trim() || `${type || 'Renovation'} project`;
    const cost = costText(p.projectCost);
    const firm = p.designerCompanyName || 'Reno firm';
    const firmSlug = p.designerPublicId || '';

    // SEO / sharing
    const desc = (p.description || '').toString().slice(0, 160) || `${title} by ${firm} on Reno Research.`;
    document.title = `${title} | Reno Research`;
    setMeta('description', desc);
    setMeta('og:title', title, 'property');
    setMeta('og:description', desc, 'property');
    setMeta('og:url', location.href, 'property');
    if (IMAGES[0]) setMeta('og:image', IMAGES[0], 'property');
    setMeta('twitter:title', title);
    setMeta('twitter:description', desc);
    let canon = document.querySelector('link[rel="canonical"]');
    if (!canon){ canon = document.createElement('link'); canon.rel = 'canonical'; document.head.appendChild(canon); }
    canon.href = `https://renoresearch.sg/portfolio-item.html?id=${encodeURIComponent(p.portfolioId || ID)}`;
    document.getElementById('crumbTitle').textContent = title;

    const galleryHtml = `
      <div class="gallery">
        <div class="gmain" id="gmain">
          ${IMAGES.length
            ? `<img src="${esc(IMAGES[0])}" alt="${esc(title)}" id="gmainImg" style="cursor:zoom-in">`
            : `<div class="ph"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`}
        </div>
        ${IMAGES.length > 1 ? `<div class="gthumbs" id="gthumbs">
          ${IMAGES.map((u, i) => `<img src="${esc(u)}" alt="" data-i="${i}" class="${i===0?'active':''}" loading="lazy">`).join('')}
        </div>` : ''}
      </div>`;

    const firmLinkHtml = firmSlug
      ? `<a href="/firms/${encodeURIComponent(firmSlug)}/">${esc(firm)}</a>`
      : `<span style="color:var(--ink);font-weight:600">${esc(firm)}</span>`;

    elContent.innerHTML = `
      <div class="phead">
        ${type ? `<span class="type-badge">${esc(type)}</span>` : ''}
        <h1>${esc(title)}</h1>
        <div class="firmline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>
          <span>by ${firmLinkHtml}</span>
        </div>
      </div>
      ${galleryHtml}
      <div class="layout">
        <div class="main">
          ${p.description ? `<div class="section"><h2>About this project</h2><div class="desc">${esc(p.description)}</div></div>` : ''}
          ${(p.tags||[]).length ? `<div class="section"><h2>Tags</h2><div class="tags">${p.tags.map(t => `<span class="chip-tag">${esc(t)}</span>`).join('')}</div></div>` : ''}
        </div>
        <aside class="aside">
          <div class="specs">
            ${specRow('Cost', cost, 'cost')}
            ${specRow('Property', p.propertyType)}
            ${specRow('Renovation', p.renovationType)}
            ${specRow('Style', (p.designTheme && !/^(other|n\/?a|none|not selected|not specified)$/i.test(p.designTheme)) ? p.designTheme : '')}
            ${specRow('Area', p.areaSize ? `${p.areaSize}${/sqft|sqm|sq/i.test(String(p.areaSize)) ? '' : ' sqft'}` : '')}
            ${specRow('Completed', p.yearOfCompletion)}
            ${specRow('Photos', IMAGES.length ? `${IMAGES.length}` : '')}
          </div>
          <div class="sidecta">
            <h3>Like this look?</h3>
            <p>Get matched with firms that deliver this style and budget.</p>
            <a href="index.html#lead" class="btn btn-gold" style="width:100%">Get matched</a>
          </div>
        </aside>
      </div>
    `;

    // Wire gallery
    const mainImg = document.getElementById('gmainImg');
    if (mainImg) mainImg.addEventListener('click', () => openLb(lbIndex));
    const thumbs = document.getElementById('gthumbs');
    if (thumbs){
      thumbs.querySelectorAll('img[data-i]').forEach(t => t.addEventListener('click', () => {
        const i = parseInt(t.dataset.i);
        lbIndex = i;
        if (mainImg) mainImg.src = IMAGES[i];
        thumbs.querySelectorAll('img').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
      }));
    }
    window.scrollTo({ top: 0 });
  } catch (err){
    showError(`${err.message}. Please try again.`);
  }
}
load();
</script>
</body>
</html>
