<style>
:root{
  --ink:#26263C; --ink-2:#1B1B2E; --ink-soft:#3A3A52;
  --gold:#E8A41E; --gold-deep:#C2861A; --gold-soft:#F6E2B6;
  --cream:#ECE7E1; --cream-soft:#F7F3ED; --paper:#FFFFFF;
  --muted:#5E5E72; --line:#E5DFD6; --ok:#1F9D6B;
  --shadow:0 18px 50px -24px rgba(31,31,52,.45);
  --shadow-sm:0 8px 24px -16px rgba(31,31,52,.5);
  --r:16px; --r-lg:22px; --r-sm:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream-soft);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.08;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1160px,92vw);margin-inline:auto}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;font-size:.72rem;color:var(--gold-deep);}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--gold);border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font-weight:700;font-size:.95rem;
  padding:.85rem 1.5rem;border-radius:999px;cursor:pointer;border:none;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease;}
.btn-gold{background:var(--gold);color:var(--ink-2);box-shadow:0 10px 22px -10px rgba(232,164,30,.7)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 28px -10px rgba(232,164,30,.75)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- APP BAR ---------- */
.appbar{position:sticky;top:0;z-index:60;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.06);}
.appbar .inner{display:flex;align-items:center;gap:1.4rem;height:74px}
.brand{display:flex;align-items:center;gap:.7rem;margin-right:auto}
.brand .chip{width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--gold),#F4C24B);
  display:grid;place-items:center;flex:none;font-family:"Fraunces",serif;font-weight:700;color:var(--ink-2);font-size:1.4rem}
.brand .name{display:flex;flex-direction:column;line-height:1}
.brand .name b{font-family:"Fraunces",serif;color:#fff;font-size:1.18rem;font-weight:600;letter-spacing:.01em}
.brand .name span{color:var(--gold);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:1.7rem;align-items:center}
.nav a{color:#D7D7E2;font-weight:500;font-size:.92rem;position:relative;padding:.3rem 0}
.nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--gold);transition:width .2s}
.nav a:hover,.nav a.active{color:#fff}.nav a:hover::after,.nav a.active::after{width:100%}
.menu-btn{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:.4rem}

/* ---------- PAGE HEADER ---------- */
.page-head{position:relative;overflow:hidden;padding:3rem 0 2rem;
  background:radial-gradient(900px 420px at 84% -30%, #FCF1D6 0%, rgba(252,241,214,0) 60%),linear-gradient(180deg,#FBF7F0,#F4EEE4);}
.page-head .dots{position:absolute;width:130px;height:130px;right:7%;bottom:-10px;opacity:.5;
  background-image:radial-gradient(var(--gold) 1.6px,transparent 1.6px);background-size:18px 18px}
.page-head h1{font-size:clamp(2rem,4vw,3rem);font-weight:600;margin-top:.5rem;max-width:20ch}
.page-head p{margin-top:.9rem;color:var(--muted);max-width:48ch}

/* ---------- FILTER TOOLBAR ---------- */
.toolbar{position:sticky;top:74px;z-index:40;background:rgba(247,243,237,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:.9rem 0}
.toolbar .row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:.8rem 1rem .8rem 2.7rem;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);font:inherit;font-size:.95rem;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,164,30,.18)}
.select{position:relative}
.select select{appearance:none;padding:.8rem 2.4rem .8rem 1.1rem;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);font:inherit;font-size:.92rem;font-weight:600;color:var(--ink);cursor:pointer}
.select select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,164,30,.18)}
.select::after{content:"";position:absolute;right:1.05rem;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);transform:translateY(-65%) rotate(45deg);pointer-events:none}
.clear-btn{background:none;border:none;color:var(--gold-deep);font-weight:700;font-size:.88rem;cursor:pointer;padding:.5rem .4rem;display:none}
.clear-btn.show{display:inline-block}

/* ---------- RESULTS ---------- */
.results{padding:1.8rem 0 4rem}
.results-meta{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1.2rem;color:var(--muted);font-size:.92rem}
.results-meta b{font-family:"Fraunces",serif;color:var(--ink);font-size:1.3rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.3rem}

/* ---------- PACKAGE CARD ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;position:relative;
  transition:transform .18s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold-soft)}
.card .cover{position:relative;aspect-ratio:4/3;background:var(--cream);overflow:hidden}
.card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .cover img{transform:scale(1.05)}
.card .cover .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--gold-deep);
  background:linear-gradient(150deg,#FBF1D9,#F4EFE7)}
.card .type-badge{position:absolute;top:.7rem;left:.7rem;background:rgba(255,255,255,.94);color:var(--ink);
  font-size:.7rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:.3rem .6rem;border-radius:7px}
.card .feat{position:absolute;top:.7rem;right:.7rem;background:var(--gold);color:var(--ink-2);
  font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:.28rem .55rem;border-radius:7px;
  display:flex;align-items:center;gap:.25rem}
.card .body{padding:1rem 1.1rem 1.15rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.card .body h3{font-size:1.06rem;font-weight:600;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .firm{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.card .desc{font-size:.84rem;color:var(--muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem;margin-top:auto;padding-top:.8rem;
  border-top:1px solid var(--line)}
.card .price{font-family:"Fraunces",serif;font-weight:700;color:var(--ink);font-size:1.18rem;line-height:1.1}
.card .price small{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:.68rem;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.card .saved{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:.3rem}

/* ---------- PAGINATION ---------- */
.pager{display:flex;justify-content:center;align-items:center;gap:.4rem;margin-top:2.4rem;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
  font:inherit;font-weight:700;font-size:.9rem;color:var(--ink);cursor:pointer;padding:0 .6rem;transition:all .15s}
.pager button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-deep)}
.pager button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .dots{color:var(--muted);padding:0 .2rem}

/* ---------- STATES ---------- */
.skeleton{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);height:300px;overflow:hidden;position:relative}
.skeleton .sk-cover{aspect-ratio:4/3;background:var(--cream)}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(232,164,30,.08),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.sk-line{height:12px;border-radius:6px;background:var(--cream);margin:.7rem 1rem}
.empty{text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty svg{color:var(--gold);opacity:.6;margin-bottom:1rem}
.empty h3{color:var(--ink);font-size:1.4rem;margin-bottom:.4rem}
.error{text-align:center;padding:3rem 1rem;color:#B23A3A}

@media (max-width:760px){
  .nav{display:none}
  .menu-btn{display:block}
}
</style>
</head>

<!-- ===== FILTER TOOLBAR ===== -->
<div class="toolbar">
  <div class="wrap row">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search packages by firm or type…" autocomplete="off" />
    </label>
    <div class="select">
      <select id="propertyType">
        <option value="">All property types</option>
        <option value="BTO HDB">BTO HDB</option>
        <option value="Resale HDB">Resale HDB</option>

<script>
const API = 'https://api.renoresearch.sg';
const PAGE_SIZE = 12;

const els = {
  q: document.getElementById('q'),
  propertyType: document.getElementById('propertyType'),
  budget: document.getElementById('budget'),
  sort: document.getElementById('sort'),
  clear: document.getElementById('clear'),
  grid: document.getElementById('grid'),
  meta: document.getElementById('meta'),
  pager: document.getElementById('pager'),
};

let state = { page: 1, total: 0, totalPages: 1, loading: false };
let allItems = null;

function esc(s){ return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stripHtml(s){ return (s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
function priceText(p){
  if (!p.price && p.price !== 0) return 'On request';
  const cur = p.currency || 'SGD';
  const fmt = n => `${cur} ${Number(n).toLocaleString()}`;
  if (p.priceMax && p.priceMax > p.price) return `${fmt(p.price)} – ${fmt(p.priceMax)}`;
  return fmt(p.price);
}
function typeOf(p){
  return p.packageName || p.propertyType || p.renovationType || 'Package';
}
function propMatch(p, val){
  if (!val) return true;
  const hay = `${p.packageName || ''} ${p.propertyType || ''} ${p.renovationType || ''} ${p.roomType || ''} ${p.description || ''}`.toLowerCase();
  const v = val.toLowerCase();
  if (v === 'landed') return /landed|terrace|semi-?d|bungalow|detached/.test(hay);
  if (v === 'condo') return /condo|condominium|apartment/.test(hay);
  if (v === 'kitchen') return /kitchen/.test(hay);
  if (v === 'commercial') return /commercial|office|shop|retail|f&b|restaurant/.test(hay);
  if (v === 'bto hdb') return /\bbto\b/.test(hay) || (/\bhdb\b/.test(hay) && !/resale/.test(hay));
  if (v === 'resale hdb') return /resale/.test(hay);
  return hay.includes(v);
}
function budgetMatch(p, val){
  if (!val) return true;
  const [min, max] = val.split('-').map(x => x === '' ? null : Number(x));
  const price = Number(p.price);
  if (!price && price !== 0) return false;
  if (min !== null && price < min) return false;
  if (max !== null && price > max) return false;
  return true;
}

function showSkeletons(){
  els.grid.innerHTML = Array.from({length: 8}).map(() =>
    `<div class="skeleton"><div class="sk-cover"></div><div class="sk-line" style="width:70%;height:16px;margin-top:1rem"></div><div class="sk-line" style="width:45%"></div></div>`
  ).join('');
  els.pager.innerHTML = '';
}

function filterAndSort(){
  const q = els.q.value.trim().toLowerCase();
  const pt = els.propertyType.value;
  const bg = els.budget.value;

  let arr = (allItems || []).filter(it => {
    if (q){
      const hay = `${it.packageName || ''} ${it.designerCompanyName || ''} ${it.description || ''} ${it.renovationType || ''} ${it.propertyType || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (!propMatch(it, pt)) return false;
    if (!budgetMatch(it, bg)) return false;
    return true;
  });

  const v = els.sort.value;
  if (v === 'price-low') arr = [...arr].sort((a,b) => (Number(a.price)||Infinity) - (Number(b.price)||Infinity));
  else if (v === 'price-high') arr = [...arr].sort((a,b) => (Number(b.price)||-1) - (Number(a.price)||-1));
  else if (v === 'saved') arr = [...arr].sort((a,b) => (b.saveCount||0) - (a.saveCount||0));
  else if (v === 'name') arr = [...arr].sort((a,b) => typeOf(a).localeCompare(typeOf(b)));
  else arr = [...arr].sort((a,b) => (b.isFeatured?1:0) - (a.isFeatured?1:0)); // Featured default
  return arr;
}

function card(p){
  const cover = p.coverImage || (p.images && p.images[0]);
  const type = typeOf(p);
  const desc = stripHtml(p.description);
  return `<article class="card">
    <div class="cover">
      ${cover
        ? `<img src="${esc(cover)}" alt="${esc(type)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'ph\\'><svg width=40 height=40 viewBox=\\'0 0 24 24\\' fill=none stroke=currentColor stroke-width=1.5><rect x=3 y=3 width=18 height=18 rx=2/><path d=\\'M3 9h18M9 21V9\\'/></svg></div>'">`
        : `<div class="ph"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></div>`}
      <span class="type-badge">${esc(type)}</span>
      ${p.isFeatured ? `<span class="feat"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.6L22 9l-5 4.5L18.5 22 12 18l-6.5 4L7 13.5 2 9l7.4-.4z"/></svg>Featured</span>` : ''}
    </div>
    <div class="body">
      <h3>${esc(type)}</h3>
      <div class="firm">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>
        ${esc(p.designerCompanyName || 'Reno firm')}
      </div>
      ${desc ? `<div class="desc">${esc(desc)}</div>` : ''}
      <div class="foot">
        <div class="price"><small>${p.priceMax && p.priceMax > p.price ? 'Price range' : 'From'}</small>${esc(priceText(p))}</div>
        ${p.saveCount ? `<span class="saved"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>${p.saveCount}</span>` : ''}
      </div>
    </div>
  </article>`;
}

function render(list){
  if (!list.length){
    els.grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <h3>No packages found</h3>
      <p>Try a different search term or clear your filters.</p></div>`;
    return;
  }
  els.grid.innerHTML = list.map(card).join('');
}

function renderPager(){
  const { page, totalPages } = state;
  if (totalPages <= 1){ els.pager.innerHTML = ''; return; }
  const btn = (label, p, opts = {}) =>
    `<button ${opts.disabled ? 'disabled' : ''} class="${opts.active ? 'active' : ''}" data-page="${p}">${label}</button>`;
  let html = btn('‹', page - 1, { disabled: page === 1 });
  const pages = new Set([1, totalPages, page, page - 1, page + 1]);
  let last = 0;
  for (let p = 1; p <= totalPages; p++){
    if (!pages.has(p)) continue;
    if (p - last > 1) html += `<span class="dots">…</span>`;
    html += btn(p, p, { active: p === page });
    last = p;
  }
  html += btn('›', page + 1, { disabled: page === totalPages });
  els.pager.innerHTML = html;
  els.pager.querySelectorAll('button[data-page]').forEach(b =>
    b.addEventListener('click', () => go(parseInt(b.dataset.page))));
}

async function fetchAll(){
  if (state.loading) return;
  state.loading = true;
  showSkeletons();
  els.meta.innerHTML = `<b>&hellip;</b><span>loading packages</span>`;
  try {
    const res = await fetch(`${API}/getrenovationpackages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ page: 1, limit: 100 })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    allItems = json.results || json.data || [];
    apply();
  } catch (err){
    els.grid.innerHTML = `<div class="error" style="grid-column:1/-1">
      <h3>Couldn't load packages</h3>
      <p>${esc(err.message)}. Please try again.</p>
      <button class="btn btn-gold" style="margin-top:1rem" onclick="fetchAll()">Retry</button></div>`;
    els.meta.innerHTML = '';
  } finally {
    state.loading = false;
  }
}

function apply(){
  if (!allItems) return;
  const filtered = filterAndSort();
  state.total = filtered.length;
  state.totalPages = Math.max(1, Math.ceil(state.total / PAGE_SIZE));
  if (state.page > state.totalPages) state.page = state.totalPages;
  const start = (state.page - 1) * PAGE_SIZE;
  render(filtered.slice(start, start + PAGE_SIZE));
  renderPager();
  const q = els.q.value.trim();
  els.meta.innerHTML = `<b>${state.total.toLocaleString()}</b><span>renovation ${state.total === 1 ? 'package' : 'packages'}${q ? ` matching “${esc(q)}”` : ''}</span>`;
}

function go(page){
  state.page = page;
  window.scrollTo({ top: document.querySelector('.toolbar').offsetTop - 80, behavior: 'smooth' });
  apply();
}
function refresh(){ state.page = 1; updateClear(); apply(); }
function updateClear(){
  const dirty = els.q.value || els.propertyType.value || els.budget.value || els.sort.value;
  els.clear.classList.toggle('show', !!dirty);
}

let debounce;
els.q.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(refresh, 350); });
els.propertyType.addEventListener('change', refresh);
els.budget.addEventListener('change', refresh);
els.sort.addEventListener('change', () => { updateClear(); state.page = 1; apply(); });
els.clear.addEventListener('click', () => {
  els.q.value = ''; els.propertyType.value = ''; els.budget.value = ''; els.sort.value = '';
  refresh();
});

fetchAll();
</script>
</body>
</html>
