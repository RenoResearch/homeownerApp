<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta name="theme-color" content="#1B1B2E" />
<meta name="geo.region" content="SG" />
<meta name="geo.placename" content="Singapore" />
<link rel="icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- These are filled in at runtime from the article data -->
<meta property="og:type" content="article" />
<meta property="og:site_name" content="Reno Research" />
<meta property="og:locale" content="en_SG" />
<meta property="og:image" content="https://renoresearch.sg/og-image.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PWKB2Y6H6F"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

<title>Renovation guide | Reno Research</title>
<meta name="description" content="Read this renovation guide from Reno Research." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26263C; --ink-2:#1B1B2E; --ink-soft:#3A3A52;
  --gold:#E8A41E; --gold-deep:#C2861A; --gold-soft:#F6E2B6;
  --cream:#ECE7E1; --cream-soft:#F7F3ED; --paper:#FFFFFF;
  --muted:#5E5E72; --line:#E5DFD6; --ok:#1F9D6B;
  --shadow:0 18px 50px -24px rgba(31,31,52,.45);
  --shadow-sm:0 8px 24px -16px rgba(31,31,52,.5);
  --r:16px; --r-lg:22px; --r-sm:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream-soft);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1160px,92vw);margin-inline:auto}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;font-size:.72rem;color:var(--gold-deep);}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--gold);border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font-weight:700;font-size:.95rem;
  padding:.85rem 1.5rem;border-radius:999px;cursor:pointer;border:none;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease;}
.btn-gold{background:var(--gold);color:var(--ink-2);box-shadow:0 10px 22px -10px rgba(232,164,30,.7)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 28px -10px rgba(232,164,30,.75)}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-deep)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- APP BAR ---------- */
.appbar{position:sticky;top:0;z-index:60;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.06);}
.appbar .inner{display:flex;align-items:center;gap:1.4rem;height:74px}
.brand{display:flex;align-items:center;gap:.7rem;margin-right:auto}
.brand .chip{width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--gold),#F4C24B);
  display:grid;place-items:center;flex:none;font-family:"Fraunces",serif;font-weight:700;color:var(--ink-2);font-size:1.4rem}
.brand .name{display:flex;flex-direction:column;line-height:1}
.brand .name b{font-family:"Fraunces",serif;color:#fff;font-size:1.18rem;font-weight:600;letter-spacing:.01em}
.brand .name span{color:var(--gold);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:1.7rem;align-items:center}
.nav a{color:#D7D7E2;font-weight:500;font-size:.92rem;position:relative;padding:.3rem 0}
.nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--gold);transition:width .2s}
.nav a:hover,.nav a.active{color:#fff}.nav a:hover::after,.nav a.active::after{width:100%}
.menu-btn{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:.4rem}

/* ---------- ARTICLE ---------- */
.crumbs{padding:1.4rem 0 0;font-size:.84rem;color:var(--muted);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.crumbs a:hover{color:var(--gold-deep)}
.crumbs .sep{opacity:.5}
.article{padding:1.2rem 0 4rem}
.article .col{width:min(760px,100%);margin-inline:auto}
.rcat{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-deep)}
.article h1{font-size:clamp(1.9rem,4vw,2.9rem);margin:.6rem 0 .5rem}
.rsub{color:var(--muted);font-size:1.1rem;margin-bottom:1.1rem}
.rmeta{display:flex;gap:1.1rem;align-items:center;color:var(--muted);font-size:.85rem;flex-wrap:wrap;
  padding-bottom:1.3rem;margin-bottom:1.6rem;border-bottom:1px solid var(--line)}
.rmeta .stat{display:flex;align-items:center;gap:.35rem}
.rcover{width:100%;aspect-ratio:16/8;object-fit:cover;background:var(--cream);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);margin-bottom:1.8rem}
.content{font-size:1.07rem;line-height:1.8;color:var(--ink-soft)}
.content p{margin:0 0 1.15rem}
.rtags{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:2rem}
.chip-tag{font-size:.74rem;font-weight:600;padding:.3rem .65rem;border-radius:999px;background:var(--cream-soft);
  border:1px solid var(--line);color:var(--ink-soft)}

/* ---------- CTA ---------- */
.cta{margin-top:2.4rem;background:linear-gradient(150deg,#FBF1D9,#F4EFE7);border:1px solid var(--gold-soft);
  border-radius:var(--r-lg);padding:1.8rem;text-align:center}
.cta h3{font-size:1.4rem;margin-bottom:.4rem}
.cta p{color:var(--muted);margin-bottom:1.2rem}

/* ---------- RELATED ---------- */
.related{margin-top:3rem}
.related h2{font-size:1.5rem;margin-bottom:1rem}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.rel-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .25s ease}
.rel-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.rel-card .cv{aspect-ratio:16/9;background:var(--cream);object-fit:cover;width:100%}
.rel-card .bd{padding:.9rem}
.rel-card .bd b{font-family:"Fraunces",serif;font-weight:600;font-size:1rem;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- STATES ---------- */
.loading,.error{text-align:center;padding:5rem 1rem;color:var(--muted)}
.error h2{color:var(--ink);font-size:1.5rem;margin-bottom:.5rem}
.sk{background:var(--paper);border-radius:8px;height:14px;margin:.8rem 0;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(232,164,30,.1),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}

@media (max-width:760px){ .nav{display:none} .menu-btn{display:block} }
</style>
</head>
<body>

<!-- ===== APP BAR ===== -->
<header class="appbar">
  <div class="wrap inner">
    <a class="brand" href="index.html" aria-label="Reno Research home">
      <span class="chip">R</span>
      <span class="name"><b>Reno Research</b><span>Renovation matchmaking</span></span>
    </a>
    <nav class="nav">
      <a href="firms.html">Firms</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="packages.html">Packages</a>
      <a href="events.html">Events</a>
      <a href="blogs.html" class="active">Guides</a>
      <a href="loan.html">Loan</a>
    </nav>
    <a href="index.html#lead" class="btn btn-gold" style="padding:.65rem 1.2rem">Get matched</a>
    <button class="menu-btn" aria-label="Menu" onclick="document.querySelector('.nav').style.display=getComputedStyle(document.querySelector('.nav')).display==='flex'?'none':'flex'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="blogs.html">Guides</a><span class="sep">/</span>
    <span id="crumbTitle">Article</span>
  </nav>
</main>

<article class="article">
  <div class="wrap">
    <div class="col" id="content">
      <div class="loading">
        <div class="sk" style="width:30%"></div>
        <div class="sk" style="width:80%;height:30px"></div>
        <div class="sk" style="width:60%"></div>
        <div class="sk" style="width:100%;height:240px;margin-top:1.5rem"></div>
        <div class="sk" style="width:100%"></div>
        <div class="sk" style="width:95%"></div>
        <div class="sk" style="width:90%"></div>
      </div>
    </div>
  </div>
</article>

<script>
const API = 'https://api.renoresearch.sg';
const params = new URLSearchParams(location.search);
const ID = params.get('id') || params.get('slug') || params.get('blogId');

function esc(s){ return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stripHtml(s){ return (s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
function fmtDate(d){
  if (!d) return '';
  try { return new Date(d).toLocaleDateString('en-SG', { year:'numeric', month:'long', day:'numeric' }); }
  catch { return ''; }
}
function setMeta(name, val, attr='name'){
  let el = document.querySelector(`meta[${attr}="${name}"]`);
  if (!el){ el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
  el.setAttribute('content', val);
}

const elContent = document.getElementById('content');

function showError(msg){
  elContent.innerHTML = `<div class="error">
    <h2>Article not found</h2>
    <p>${esc(msg)}</p>
    <a href="blogs.html" class="btn btn-gold" style="margin-top:1.2rem">Browse all guides</a>
  </div>`;
}

function relatedCard(r){
  const id = r.slug || r._id;
  return `<a class="rel-card" href="blog.html?id=${encodeURIComponent(id)}">
    ${r.coverImage ? `<img class="cv" src="${esc(r.coverImage)}" alt="${esc(r.title)}" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="cv"></div>`}
    <div class="bd"><b>${esc(r.title || 'Untitled')}</b></div>
  </a>`;
}

async function load(){
  if (!ID){ showError('No article was specified.'); return; }
  try {
    const res = await fetch(`${API}/gethomeownerblogbyId/${encodeURIComponent(ID)}`, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const b = (await res.json()).data || {};

    // SEO / sharing
    const desc = stripHtml(b.subtitle) || stripHtml(b.mainContent).slice(0, 160);
    document.title = `${b.title || 'Renovation guide'} | Reno Research`;
    setMeta('description', desc);
    setMeta('og:title', b.title || 'Renovation guide', 'property');
    setMeta('og:description', desc, 'property');
    setMeta('og:url', location.href, 'property');
    if (b.coverImage) setMeta('og:image', b.coverImage, 'property');
    setMeta('twitter:title', b.title || 'Renovation guide');
    setMeta('twitter:description', desc);
    let canon = document.querySelector('link[rel="canonical"]');
    if (!canon){ canon = document.createElement('link'); canon.rel = 'canonical'; document.head.appendChild(canon); }
    // Canonical points at the pre-rendered clean URL (when the blog has a slug).
    canon.href = b.slug
      ? `https://renoresearch.sg/blogs/${encodeURIComponent(b.slug)}/`
      : `https://renoresearch.sg/blog.html?id=${encodeURIComponent(b._id || ID)}`;
    document.getElementById('crumbTitle').textContent = b.title || 'Article';

    const paras = stripHtml(b.mainContent).split(/\n+/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('');
    const related = (b.relatedArticles || []).filter(Boolean);

    elContent.innerHTML = `
      ${b.category ? `<div class="rcat">${esc(b.category)}</div>` : ''}
      <h1>${esc(b.title || '')}</h1>
      ${b.subtitle ? `<p class="rsub">${esc(b.subtitle)}</p>` : ''}
      <div class="rmeta">
        ${b.readTimeMinutes ? `<span class="stat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${b.readTimeMinutes} min read</span>` : ''}
        <span class="stat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>${(b.viewCount||0).toLocaleString()} views</span>
        ${b.createdAt ? `<span class="stat">${esc(fmtDate(b.createdAt))}</span>` : ''}
      </div>
      ${b.coverImage ? `<img class="rcover" src="${esc(b.coverImage)}" alt="${esc(b.title)}" onerror="this.remove()">` : ''}
      <div class="content">${paras || '<p>No content available.</p>'}</div>
      ${(b.tagsList||[]).length ? `<div class="rtags">${b.tagsList.map(t => `<span class="chip-tag">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="cta">
        <h3>Planning a renovation?</h3>
        <p>Get matched with vetted firms that fit your budget and style — free.</p>
        <a href="index.html#lead" class="btn btn-gold">Get matched</a>
      </div>
      ${related.length ? `<section class="related">
        <h2>Related guides</h2>
        <div class="rel-grid">${related.map(relatedCard).join('')}</div>
      </section>` : ''}
    `;
    window.scrollTo({ top: 0 });
  } catch (err){
    showError(`${err.message}. Please try again.`);
  }
}
load();
</script>
</body>
</html>
