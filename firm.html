<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta name="theme-color" content="#1B1B2E" />
<meta name="geo.region" content="SG" />
<meta name="geo.placename" content="Singapore" />
<link rel="icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta property="og:type" content="profile" />
<meta property="og:site_name" content="Reno Research" />
<meta property="og:locale" content="en_SG" />
<meta property="og:image" content="https://renoresearch.sg/og-image.jpg" />
<meta name="twitter:card" content="summary_large_image" />

<script async src="https://www.googletagmanager.com/gtag/js?id=G-PWKB2Y6H6F"></script>

<title>Renovation firm | Reno Research</title>
<meta name="description" content="View this vetted renovation firm on Reno Research." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26263C; --ink-2:#1B1B2E; --ink-soft:#3A3A52;
  --gold:#E8A41E; --gold-deep:#C2861A; --gold-soft:#F6E2B6;
  --cream:#ECE7E1; --cream-soft:#F7F3ED; --paper:#FFFFFF;
  --muted:#5E5E72; --line:#E5DFD6; --ok:#1F9D6B;
  --shadow:0 18px 50px -24px rgba(31,31,52,.45);
  --shadow-sm:0 8px 24px -16px rgba(31,31,52,.5);
  --r:16px; --r-lg:22px; --r-sm:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream-soft);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1160px,92vw);margin-inline:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font-weight:700;font-size:.95rem;
  padding:.85rem 1.5rem;border-radius:999px;cursor:pointer;border:none;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease;}
.btn-gold{background:var(--gold);color:var(--ink-2);box-shadow:0 10px 22px -10px rgba(232,164,30,.7)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 28px -10px rgba(232,164,30,.75)}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-deep)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- APP BAR ---------- */
.appbar{position:sticky;top:0;z-index:60;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.06);}
.appbar .inner{display:flex;align-items:center;gap:1.4rem;height:74px}
.brand{display:flex;align-items:center;gap:.7rem;margin-right:auto}
.brand .chip{width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--gold),#F4C24B);
  display:grid;place-items:center;flex:none;font-family:"Fraunces",serif;font-weight:700;color:var(--ink-2);font-size:1.4rem}
.brand .name{display:flex;flex-direction:column;line-height:1}
.brand .name b{font-family:"Fraunces",serif;color:#fff;font-size:1.18rem;font-weight:600;letter-spacing:.01em}
.brand .name span{color:var(--gold);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:1.7rem;align-items:center}
.nav a{color:#D7D7E2;font-weight:500;font-size:.92rem;position:relative;padding:.3rem 0}
.nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--gold);transition:width .2s}
.nav a:hover,.nav a.active{color:#fff}.nav a:hover::after,.nav a.active::after{width:100%}
.menu-btn{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:.4rem}

/* ---------- BREADCRUMB ---------- */
.crumbs{padding:1.4rem 0 0;font-size:.84rem;color:var(--muted);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.crumbs a:hover{color:var(--gold-deep)}
.crumbs .sep{opacity:.5}

/* ---------- HERO ---------- */
.firm{padding:1.2rem 0 4rem}
.fhero{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);
  padding:1.8rem;display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;position:relative}
.fav{width:84px;height:84px;border-radius:18px;flex:none;display:grid;place-items:center;
  font-weight:800;color:#fff;font-size:2rem;font-family:"Fraunces",serif}
.flogo{width:84px;height:84px;border-radius:18px;flex:none;object-fit:cover;background:var(--cream);border:1px solid var(--line)}
.fhead{min-width:0;flex:1}
.fhead h1{font-size:clamp(1.6rem,3.6vw,2.4rem);margin-bottom:.3rem}
.fhead .loc{color:var(--muted);display:flex;align-items:center;gap:.35rem;font-size:.95rem}
.badge{position:absolute;top:1.4rem;right:1.4rem;font-size:.68rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:.3rem .6rem;border-radius:7px}
.badge.platinum{background:#E8E6F0;color:#4A3F7A}
.badge.gold{background:#FBF1D9;color:var(--gold-deep)}
.badge.silver{background:#EEF0F2;color:#5B6470}
.fstats{display:flex;gap:1.6rem;margin-top:1.2rem;flex-wrap:wrap}
.fstat{display:flex;flex-direction:column}
.fstat b{font-family:"Fraunces",serif;font-size:1.4rem;color:var(--ink);line-height:1}
.fstat span{font-size:.78rem;color:var(--muted);margin-top:.25rem}
.fstat .star{color:var(--gold)}

/* ---------- BODY ---------- */
.layout{display:grid;grid-template-columns:1fr 320px;gap:2rem;align-items:start;margin-top:1.8rem}
.section{margin-bottom:1.6rem}
.section h2{font-size:1.25rem;margin-bottom:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip-tag{font-size:.78rem;font-weight:600;padding:.32rem .7rem;border-radius:999px;background:var(--cream-soft);
  border:1px solid var(--line);color:var(--ink-soft)}
.chip-tag.spec{background:#FBF1D9;border-color:var(--gold-soft);color:var(--gold-deep)}
.note{color:var(--ink-soft);font-size:1rem;line-height:1.75;white-space:pre-wrap}

/* showroom photos */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.shots img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--cream);cursor:zoom-in}

/* google reviews */
.reviews{display:flex;flex-direction:column;gap:.8rem}
.review{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.review .rtop{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.review .rname{font-weight:700;font-size:.95rem}
.review .rstars{color:var(--gold);font-size:.9rem;margin-left:auto}
.review .rtext{color:var(--ink-soft);font-size:.92rem;line-height:1.6}

/* portfolio strip */
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.pf-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .25s ease}
.pf-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pf-card .cv{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--cream)}
.pf-card .bd{padding:.8rem}
.pf-card .bd b{font-family:"Fraunces",serif;font-weight:600;font-size:.98rem;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* sidebar */
.aside{position:sticky;top:94px;display:flex;flex-direction:column;gap:1rem}
.specs{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.spec-row{display:flex;justify-content:space-between;gap:1rem;padding:.85rem 1.1rem;border-bottom:1px solid var(--line);font-size:.92rem}
.spec-row:last-child{border-bottom:none}
.spec-row .k{color:var(--muted)}
.spec-row .v{font-weight:700;text-align:right;color:var(--ink)}
.sidecta{background:linear-gradient(150deg,#FBF1D9,#F4EFE7);border:1px solid var(--gold-soft);
  border-radius:var(--r);padding:1.3rem;text-align:center}
.sidecta h3{font-size:1.15rem;margin-bottom:.4rem}
.sidecta p{color:var(--muted);font-size:.9rem;margin-bottom:1rem}

/* states */
.loading,.error{text-align:center;padding:5rem 1rem;color:var(--muted)}
.error h2{color:var(--ink);font-size:1.5rem;margin-bottom:.5rem}
.sk{background:var(--paper);border-radius:8px;height:14px;margin:.8rem 0;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(232,164,30,.1),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
  background:rgba(15,15,26,.92);padding:2rem}
.lightbox.open{display:flex}
.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:8px}
.lightbox .lb-close{position:absolute;top:1.2rem;right:1.2rem;width:42px;height:42px;border-radius:50%;
  border:none;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}

@media (max-width:880px){ .layout{grid-template-columns:1fr} .aside{position:static} }
@media (max-width:760px){ .nav{display:none} .menu-btn{display:block} }
</style>
</head>
<body>

<!-- ===== APP BAR ===== -->
<header class="appbar">
  <div class="wrap inner">
    <a class="brand" href="index.html" aria-label="Reno Research home">
      <span class="chip">R</span>
      <span class="name"><b>Reno Research</b><span>Renovation matchmaking</span></span>
    </a>
    <nav class="nav">
      <a href="firms.html" class="active">Firms</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="packages.html">Packages</a>
      <a href="events.html">Events</a>
      <a href="blogs.html">Guides</a>
      <a href="loan.html">Loan</a>
    </nav>
    <a href="index.html#lead" class="btn btn-gold" style="padding:.65rem 1.2rem">Get matched</a>
    <button class="menu-btn" aria-label="Menu" onclick="document.querySelector('.nav').style.display=getComputedStyle(document.querySelector('.nav')).display==='flex'?'none':'flex'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="firms.html">Firms</a><span class="sep">/</span>
    <span id="crumbTitle">Firm</span>
  </nav>
</main>

<section class="firm">
  <div class="wrap" id="content">
    <div class="loading">
      <div class="sk" style="width:40%;height:30px"></div>
      <div class="sk" style="width:60%"></div>
      <div class="sk" style="width:100%;height:160px;margin-top:1.5rem"></div>
    </div>
  </div>
</section>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <img id="lbImg" alt="">
</div>

<script>
const API = 'https://api.renoresearch.sg';
const params = new URLSearchParams(location.search);
// Slug-based: ?id=home4u-pte-ltd. Also tolerate a pretty path /firms/<slug>.
let SLUG = params.get('id') || params.get('slug') || params.get('publicId') || params.get('firmId');
if (!SLUG){
  const m = location.pathname.match(/\/firms?\/([^\/?#]+)/i);
  if (m) SLUG = decodeURIComponent(m[1]);
}

const AV_COLORS = ['#E8A41E','#2E7D6B','#7D5BA6','#C0392B','#2D6CB0','#D98324','#3E8E7E','#9B4F96','#B7791F','#5C6BC0'];

function esc(s){ return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function colorFor(name){ let h=0; for(let i=0;i<(name||'').length;i++) h=(h*31+name.charCodeAt(i))>>>0; return AV_COLORS[h%AV_COLORS.length]; }
function initials(name){ const p=(name||'?').trim().split(/\s+/).filter(Boolean); return ((p[0]?.[0]||'?')+(p[1]?.[0]||'')).toUpperCase(); }
function titleCase(s){ return String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
function setMeta(name, val, attr='name'){
  let el = document.querySelector(`meta[${attr}="${name}"]`);
  if (!el){ el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
  el.setAttribute('content', val);
}

const elContent = document.getElementById('content');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
function openLb(src){ if(!src) return; lbImg.src = src; lightbox.classList.add('open'); document.body.style.overflow='hidden'; }
function closeLb(){ lightbox.classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('lbClose').addEventListener('click', closeLb);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

function showError(msg){
  elContent.innerHTML = `<div class="error">
    <h2>Firm not found</h2>
    <p>${esc(msg)}</p>
    <a href="firms.html" class="btn btn-gold" style="margin-top:1.2rem">Browse all firms</a>
  </div>`;
}
function specRow(k, v){ return v ? `<div class="spec-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>` : ''; }
function stars(n){ const r=Math.round(n||0); return '★★★★★'.slice(0,r) + '☆☆☆☆☆'.slice(0,5-r); }

async function load(){
  if (!SLUG){ showError('No firm was specified.'); return; }
  try {
    const res = await fetch(`${API}/getdesignerbypublicid/${encodeURIComponent(SLUG)}`, { headers: { Accept: 'application/json' } });
    if (res.status === 404){ showError('This firm may no longer be listed.'); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const f = (await res.json()).designer || {};

    const name = f.companyName || 'Renovation firm';
    const slug = f.publicId || SLUG;
    const logo = f.companyLogo || '';
    const desc = (f.companyDescription || '').trim();
    const address = (f.address || '').trim();
    const services = (f.selectedContractorServices || []).filter(Boolean);
    const styles = (f.selectedRenovationStyles || []).filter(Boolean);
    const certs = (f.certifications || []).filter(Boolean);
    const shots = (f.showroomImageUrls || []).filter(Boolean);
    const projects = (f.portfolio || []).filter(Boolean);
    const gp = f.googlePlaces || null;
    const rating = gp?.overallRating || 0;
    const totalReviews = gp?.totalReviews || 0;
    const reviews = (gp?.reviews || []).filter(r => r && (r.text || r.comment)).slice(0, 5);
    const tier = (f.data?.membership?.type || 'free').toLowerCase();
    const badge = ['platinum','gold','silver'].includes(tier) ? `<span class="badge ${tier}">${tier}</span>` : '';

    // SEO / sharing
    const metaDesc = desc.slice(0, 160) || `${name} — a vetted renovation firm on Reno Research${address ? ', ' + address : ''}.`;
    document.title = `${name} | Reno Research`;
    setMeta('description', metaDesc);
    setMeta('og:title', name, 'property');
    setMeta('og:description', metaDesc, 'property');
    setMeta('og:url', location.href, 'property');
    if (logo) setMeta('og:image', logo, 'property');
    setMeta('twitter:title', name);
    setMeta('twitter:description', metaDesc);
    let canon = document.querySelector('link[rel="canonical"]');
    if (!canon){ canon = document.createElement('link'); canon.rel = 'canonical'; document.head.appendChild(canon); }
    // Canonical points at the pre-rendered clean URL so the two don't compete in search.
    canon.href = `https://renoresearch.sg/firms/${encodeURIComponent(slug)}/`;
    document.getElementById('crumbTitle').textContent = name;

    const avatar = logo
      ? `<img class="flogo" src="${esc(logo)}" alt="${esc(name)} logo" onerror="this.outerHTML='<span class=\\'fav\\' style=\\'background:${colorFor(name)}\\'>${esc(initials(name))}</span>'">`
      : `<span class="fav" style="background:${colorFor(name)}">${esc(initials(name))}</span>`;

    elContent.innerHTML = `
      <div class="fhero">
        ${badge}
        ${avatar}
        <div class="fhead">
          <h1>${esc(name)}</h1>
          ${address ? `<div class="loc">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${esc(address)}
          </div>` : ''}
          <div class="fstats">
            <div class="fstat"><b>${rating > 0 ? '<span class="star">★</span> ' + rating.toFixed(1) : 'New'}</b><span>${totalReviews ? totalReviews + ' Google reviews' : 'on Reno Research'}</span></div>
            ${f.experience ? `<div class="fstat"><b>${esc(f.experience)}+</b><span>years experience</span></div>` : ''}
            ${f.teamSize ? `<div class="fstat"><b>${esc(f.teamSize)}</b><span>team size</span></div>` : ''}
            ${projects.length ? `<div class="fstat"><b>${projects.length}</b><span>projects</span></div>` : ''}
          </div>
        </div>
      </div>

      <div class="layout">
        <div class="main">
          ${desc ? `<div class="section"><h2>About</h2><div class="note">${esc(desc)}</div></div>` : ''}

          ${services.length ? `<div class="section"><h2>Services</h2>
            <div class="chips">${services.map(s => `<span class="chip-tag spec">${esc(titleCase(s))}</span>`).join('')}</div></div>` : ''}

          ${styles.length ? `<div class="section"><h2>Design styles</h2>
            <div class="chips">${styles.map(s => `<span class="chip-tag">${esc(titleCase(s))}</span>`).join('')}</div></div>` : ''}

          ${certs.length ? `<div class="section"><h2>Certifications</h2>
            <div class="chips">${certs.map(c => `<span class="chip-tag">${esc(c)}</span>`).join('')}</div></div>` : ''}

          ${shots.length ? `<div class="section"><h2>Showroom</h2>
            <div class="shots" id="shots">${shots.map(u => `<img src="${esc(u)}" alt="${esc(name)} showroom" loading="lazy" data-full="${esc(u)}" onerror="this.remove()">`).join('')}</div></div>` : ''}

          <div class="section" id="pfSection" style="${projects.length ? '' : 'display:none'}">
            <h2>Recent projects</h2>
            <div class="pf-grid" id="pfGrid"></div>
          </div>

          ${reviews.length ? `<div class="section"><h2>What clients say</h2>
            <div class="reviews">${reviews.map(r => `<div class="review">
              <div class="rtop"><span class="rname">${esc(r.authorName || r.author_name || 'Google user')}</span><span class="rstars">${stars(r.rating)}</span></div>
              <div class="rtext">${esc(r.text || r.comment || '')}</div>
            </div>`).join('')}</div></div>` : ''}
        </div>

        <aside class="aside">
          <div class="specs">
            ${specRow('Address', address)}
            ${specRow('Experience', f.experience ? `${f.experience} years` : '')}
            ${specRow('Team size', f.teamSize)}
            ${specRow('Rating', rating > 0 ? `${rating.toFixed(1)} / 5 (${totalReviews})` : 'Not yet rated')}
            ${specRow('Membership', ['platinum','gold','silver'].includes(tier) ? titleCase(tier) : '')}
            ${specRow('UEN', f.uen)}
          </div>
          <div class="sidecta">
            <h3>Work with ${esc(name.split(/\s+/)[0])}</h3>
            <p>Get matched and receive a free quote tailored to your project.</p>
            <a href="index.html#lead" class="btn btn-gold" style="width:100%">Get matched</a>
          </div>
        </aside>
      </div>
    `;
    window.scrollTo({ top: 0 });

    // Wire showroom lightbox
    const shotsEl = document.getElementById('shots');
    if (shotsEl) shotsEl.querySelectorAll('img[data-full]').forEach(img =>
      img.addEventListener('click', () => openLb(img.dataset.full)));

    // Render the firm's own portfolio items (embedded in the designer doc)
    if (projects.length){
      const grid = document.getElementById('pfGrid');
      grid.innerHTML = projects.slice(0, 8).map(p => {
        const cover = p.coverImage || (p.imageUrls && p.imageUrls[0]) || (p.images && p.images[0]) || '';
        const title = (p.title || '').trim() || `${p.renovationType || p.propertyType || 'Renovation'} project`;
        const pid = p.portfolioId || p._id || '';
        const inner = `${cover ? `<img class="cv" src="${esc(cover)}" alt="${esc(title)}" loading="lazy" onerror="this.style.display='none'">` : `<div class="cv"></div>`}
          <div class="bd"><b>${esc(title)}</b></div>`;
        return pid
          ? `<a class="pf-card" href="portfolio-item.html?id=${encodeURIComponent(pid)}">${inner}</a>`
          : `<div class="pf-card">${inner}</div>`;
      }).join('');
    }
  } catch (err){
    showError(`${err.message}. Please try again.`);
  }
}
load();
</script>
</body>
</html>
