<style>
:root{
  --ink:#26263C; --ink-2:#1B1B2E; --ink-soft:#3A3A52;
  --gold:#E8A41E; --gold-deep:#C2861A; --gold-soft:#F6E2B6;
  --cream:#ECE7E1; --cream-soft:#F7F3ED; --paper:#FFFFFF;
  --muted:#5E5E72; --line:#E5DFD6; --ok:#1F9D6B;
  --shadow:0 18px 50px -24px rgba(31,31,52,.45);
  --shadow-sm:0 8px 24px -16px rgba(31,31,52,.5);
  --r:16px; --r-lg:22px; --r-sm:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream-soft);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.08;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1160px,92vw);margin-inline:auto}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;font-size:.72rem;color:var(--gold-deep);}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--gold);border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font-weight:700;font-size:.95rem;
  padding:.85rem 1.5rem;border-radius:999px;cursor:pointer;border:none;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease;}
.btn-gold{background:var(--gold);color:var(--ink-2);box-shadow:0 10px 22px -10px rgba(232,164,30,.7)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 28px -10px rgba(232,164,30,.75)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- APP BAR ---------- */
.appbar{position:sticky;top:0;z-index:60;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.06);}
.appbar .inner{display:flex;align-items:center;gap:1.4rem;height:74px}
.brand{display:flex;align-items:center;gap:.7rem;margin-right:auto}
.brand .chip{width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--gold),#F4C24B);
  display:grid;place-items:center;flex:none;font-family:"Fraunces",serif;font-weight:700;color:var(--ink-2);font-size:1.4rem}
.brand .name{display:flex;flex-direction:column;line-height:1}
.brand .name b{font-family:"Fraunces",serif;color:#fff;font-size:1.18rem;font-weight:600;letter-spacing:.01em}
.brand .name span{color:var(--gold);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:1.7rem;align-items:center}
.nav a{color:#D7D7E2;font-weight:500;font-size:.92rem;position:relative;padding:.3rem 0}
.nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--gold);transition:width .2s}
.nav a:hover,.nav a.active{color:#fff}.nav a:hover::after,.nav a.active::after{width:100%}
.menu-btn{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:.4rem}

/* ---------- PAGE HEADER ---------- */
.page-head{position:relative;overflow:hidden;padding:3rem 0 2rem;
  background:radial-gradient(900px 420px at 84% -30%, #FCF1D6 0%, rgba(252,241,214,0) 60%),linear-gradient(180deg,#FBF7F0,#F4EEE4);}
.page-head .dots{position:absolute;width:130px;height:130px;right:7%;bottom:-10px;opacity:.5;
  background-image:radial-gradient(var(--gold) 1.6px,transparent 1.6px);background-size:18px 18px}
.page-head h1{font-size:clamp(2rem,4vw,3rem);font-weight:600;margin-top:.5rem;max-width:20ch}
.page-head p{margin-top:.9rem;color:var(--muted);max-width:48ch}

/* ---------- FILTER TOOLBAR ---------- */
.toolbar{position:sticky;top:74px;z-index:40;background:rgba(247,243,237,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:.9rem 0}
.toolbar .row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:.8rem 1rem .8rem 2.7rem;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);font:inherit;font-size:.95rem;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,164,30,.18)}
.select{position:relative}
.select select{appearance:none;padding:.8rem 2.4rem .8rem 1.1rem;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);font:inherit;font-size:.92rem;font-weight:600;color:var(--ink);cursor:pointer}
.select select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,164,30,.18)}
.select::after{content:"";position:absolute;right:1.05rem;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);transform:translateY(-65%) rotate(45deg);pointer-events:none}
.clear-btn{background:none;border:none;color:var(--gold-deep);font-weight:700;font-size:.88rem;cursor:pointer;padding:.5rem .4rem;display:none}
.clear-btn.show{display:inline-block}

/* ---------- RESULTS ---------- */
.results{padding:1.8rem 0 4rem}
.results-meta{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1.2rem;color:var(--muted);font-size:.92rem}
.results-meta b{font-family:"Fraunces",serif;color:var(--ink);font-size:1.3rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.3rem}

/* ---------- BLOG CARD ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;position:relative;
  transition:transform .18s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold-soft)}
.card .cover{position:relative;aspect-ratio:16/9;background:var(--cream);overflow:hidden}
.card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .cover img{transform:scale(1.05)}
.card .cover .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--gold-deep);
  background:linear-gradient(150deg,#FBF1D9,#F4EFE7)}
.card .cat{position:absolute;top:.7rem;left:.7rem;background:rgba(27,27,46,.82);color:#fff;
  font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:.3rem .6rem;border-radius:7px}
.card .pin{position:absolute;top:.7rem;right:.7rem;background:var(--gold);color:var(--ink-2);
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.card .body{padding:1.1rem 1.15rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.card .body h3{font-size:1.1rem;font-weight:600;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .body p{font-size:.86rem;color:var(--muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.1rem}
.chip-tag{font-size:.72rem;font-weight:600;padding:.26rem .56rem;border-radius:999px;background:var(--cream-soft);
  border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;transition:all .15s}
.chip-tag:hover{border-color:var(--gold);color:var(--gold-deep)}
.card .foot{display:flex;align-items:center;gap:.9rem;margin-top:auto;padding-top:.8rem;
  border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
.card .foot .stat{display:flex;align-items:center;gap:.35rem}

/* ---------- PAGINATION ---------- */
.pager{display:flex;justify-content:center;align-items:center;gap:.4rem;margin-top:2.4rem;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
  font:inherit;font-weight:700;font-size:.9rem;color:var(--ink);cursor:pointer;padding:0 .6rem;transition:all .15s}
.pager button:hover:not(:disabled){border-color:var(--gold);color:var(--gold-deep)}
.pager button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .dots{color:var(--muted);padding:0 .2rem}

/* ---------- STATES ---------- */
.skeleton{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);height:330px;overflow:hidden;position:relative}
.skeleton .sk-cover{aspect-ratio:16/9;background:var(--cream)}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(232,164,30,.08),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.sk-line{height:12px;border-radius:6px;background:var(--cream);margin:.7rem 1.1rem}
.empty{text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty svg{color:var(--gold);opacity:.6;margin-bottom:1rem}
.empty h3{color:var(--ink);font-size:1.4rem;margin-bottom:.4rem}
.error{text-align:center;padding:3rem 1rem;color:#B23A3A}

/* ---------- READER MODAL ---------- */
.reader{position:fixed;inset:0;z-index:120;display:none;align-items:flex-start;justify-content:center;
  padding:5vh 1rem;background:rgba(27,27,46,.55);backdrop-filter:blur(4px);overflow-y:auto}
.reader.open{display:flex}
.reader .panel{background:var(--paper);width:min(760px,100%);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow);position:relative;margin-bottom:5vh}
.reader .close{position:absolute;top:1rem;right:1rem;z-index:2;width:38px;height:38px;border-radius:50%;
  border:none;background:rgba(27,27,46,.7);color:#fff;cursor:pointer;display:grid;place-items:center}
.reader .close:hover{background:var(--ink)}
.reader .rcover{width:100%;aspect-ratio:16/8;object-fit:cover;background:var(--cream)}
.reader .rbody{padding:1.8rem clamp(1.2rem,4vw,2.6rem) 2.6rem}
.reader .rcat{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-deep)}
.reader h2{font-size:clamp(1.5rem,3vw,2.1rem);margin:.5rem 0 .4rem}
.reader .rsub{color:var(--muted);font-size:1.02rem;margin-bottom:1rem}
.reader .rmeta{display:flex;gap:1rem;color:var(--muted);font-size:.82rem;padding-bottom:1.1rem;
  margin-bottom:1.2rem;border-bottom:1px solid var(--line)}
.reader .content{font-size:1rem;line-height:1.75;color:var(--ink-soft);white-space:pre-wrap}
.reader .content p{margin:0 0 1rem}
.reader .rloading{padding:3rem;text-align:center;color:var(--muted)}
.reader .rtags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.6rem}

@media (max-width:760px){
  .nav{display:none}
  .menu-btn{display:block}
}
</style>
</head>

<!-- ===== FILTER TOOLBAR ===== -->
<div class="toolbar">
  <div class="wrap row">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search articles…" autocomplete="off" />
    </label>

      <select id="category">
        <option value="">All categories</option>

<!-- ===== RESULTS ===== -->

  </div>

<script>
const API = 'https://api.renoresearch.sg';
const PAGE_SIZE = 12;
// Popular topics surfaced as tag filter options (kept short; server filters by exact tag)
const TAG_OPTIONS = ['HDB','Condo','BTO','Resale HDB','Landed','Budget','Design','Kitchen','Carpentry',
  'Contractor','Planning','Materials','Regulations','Tips','Process'];

const els = {
  q: document.getElementById('q'),
  category: document.getElementById('category'),
  tag: document.getElementById('tag'),
  sort: document.getElementById('sort'),
  clear: document.getElementById('clear'),
  grid: document.getElementById('grid'),
  meta: document.getElementById('meta'),
  pager: document.getElementById('pager'),
};

let state = { page: 1, total: 0, totalPages: 1, loading: false };

function esc(s){ return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stripHtml(s){ return (s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
function timeAgo(d){
  if (!d) return '';
  const days = Math.floor((Date.now() - new Date(d)) / 86400000);
  if (days < 1) return 'Today';
  if (days < 30) return `${days}d ago`;
  if (days < 365) return `${Math.floor(days/30)}mo ago`;
  return `${Math.floor(days/365)}y ago`;
}

els.tag.insertAdjacentHTML('beforeend', TAG_OPTIONS.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join(''));

function showSkeletons(){
  els.grid.innerHTML = Array.from({length: 6}).map(() =>
    `<div class="skeleton"><div class="sk-cover"></div><div class="sk-line" style="width:75%;height:16px;margin-top:1rem"></div><div class="sk-line" style="width:90%"></div><div class="sk-line" style="width:50%"></div></div>`
  ).join('');
  els.pager.innerHTML = '';
}

function card(b){
  const cover = b.coverImage;
  const summary = stripHtml(b.subtitle) || stripHtml(b.mainContent).slice(0, 140);
  const tags = (b.tagsList || []).slice(0, 3);
  const id = b.slug || b._id;
  // Prefer the pre-rendered clean URL when the blog has a slug; fall back to the dynamic page.
  const href = b.slug ? `/blogs/${encodeURIComponent(b.slug)}/` : `blog.html?id=${encodeURIComponent(id)}`;
  return `<article class="card">
    <a class="cover" href="${href}" aria-label="${esc(b.title)}">
      ${cover
        ? `<img src="${esc(cover)}" alt="${esc(b.title)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'ph\\'><svg width=40 height=40 viewBox=\\'0 0 24 24\\' fill=none stroke=currentColor stroke-width=1.5><path d=\\'M4 19.5A2.5 2.5 0 0 1 6.5 17H20\\'/><path d=\\'M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\\'/></svg></div>'">`
        : `<div class="ph"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`}
      ${b.category ? `<span class="cat">${esc(b.category)}</span>` : ''}
      ${b.isPinned ? `<span class="pin" title="Featured"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.6L22 9l-5 4.5L18.5 22 12 18l-6.5 4L7 13.5 2 9l7.4-.4z"/></svg></span>` : ''}
    </a>
    <div class="body">
      <h3><a href="${href}">${esc(b.title || 'Untitled')}</a></h3>
      ${summary ? `<p>${esc(summary)}</p>` : ''}
      <div class="chips">
        ${tags.map(t => `<span class="chip-tag" data-tag="${esc(t)}">${esc(t)}</span>`).join('')}
      </div>
      <div class="foot">
        ${b.readTimeMinutes ? `<span class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${b.readTimeMinutes} min read</span>` : ''}
        <span class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>${(b.viewCount||0).toLocaleString()}</span>
        <span class="stat" style="margin-left:auto">${esc(timeAgo(b.createdAt))}</span>
      </div>
    </div>
  </article>`;
}

function render(list){
  if (!list.length){
    els.grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <h3>No articles found</h3>
      <p>Try a different search term or clear your filters.</p></div>`;
    return;
  }
  els.grid.innerHTML = list.map(card).join('');
  // tag chips act as quick filters
  els.grid.querySelectorAll('.chip-tag[data-tag]').forEach(c =>
    c.addEventListener('click', () => {
      const t = c.dataset.tag;
      const opt = [...els.tag.options].find(o => o.value.toLowerCase() === t.toLowerCase());
      els.tag.value = opt ? opt.value : '';
      if (!opt){ els.q.value = t; } // fall back to search if not a preset topic
      refresh();
    }));
}

function renderPager(){
  const { page, totalPages } = state;
  if (totalPages <= 1){ els.pager.innerHTML = ''; return; }
  const btn = (label, p, opts = {}) =>
    `<button ${opts.disabled ? 'disabled' : ''} class="${opts.active ? 'active' : ''}" data-page="${p}">${label}</button>`;
  let html = btn('‹', page - 1, { disabled: page === 1 });
  const pages = new Set([1, totalPages, page, page - 1, page + 1]);
  let last = 0;
  for (let p = 1; p <= totalPages; p++){
    if (!pages.has(p)) continue;
    if (p - last > 1) html += `<span class="dots">…</span>`;
    html += btn(p, p, { active: p === page });
    last = p;
  }
  html += btn('›', page + 1, { disabled: page === totalPages });
  els.pager.innerHTML = html;
  els.pager.querySelectorAll('button[data-page]').forEach(b =>
    b.addEventListener('click', () => go(parseInt(b.dataset.page))));
}

function clientSort(list){
  const v = els.sort.value;
  if (v === 'newest') return [...list].sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));
  if (v === 'popular') return [...list].sort((a,b) => (b.viewCount||0) - (a.viewCount||0));
  return list;
}

async function load(){
  if (state.loading) return;
  state.loading = true;
  showSkeletons();
  els.meta.innerHTML = `<b>&hellip;</b><span>loading guides</span>`;

  const params = new URLSearchParams({ page: state.page, limit: PAGE_SIZE });
  if (els.q.value.trim()) params.set('search', els.q.value.trim());
  if (els.category.value) params.set('category', els.category.value);
  if (els.tag.value) params.set('tag', els.tag.value);

  try {
    const res = await fetch(`${API}/gethomeownerblogs?${params}`, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const list = clientSort(json.data || []);
    state.total = json.pagination?.total ?? list.length;
    state.totalPages = json.pagination?.totalPages ?? 1;
    render(list);
    renderPager();
    const q = els.q.value.trim();
    els.meta.innerHTML = `<b>${state.total.toLocaleString()}</b><span>renovation ${state.total === 1 ? 'guide' : 'guides'}${q ? ` matching “${esc(q)}”` : ''}</span>`;
  } catch (err){
    els.grid.innerHTML = `<div class="error" style="grid-column:1/-1">
      <h3>Couldn't load guides</h3>
      <p>${esc(err.message)}. Please try again.</p>
      <button class="btn btn-gold" style="margin-top:1rem" onclick="load()">Retry</button></div>`;
    els.meta.innerHTML = '';
  } finally {
    state.loading = false;
  }
}

function go(page){
  state.page = page;
  window.scrollTo({ top: document.querySelector('.toolbar').offsetTop - 80, behavior: 'smooth' });
  load();
}
function refresh(){ state.page = 1; updateClear(); load(); }
function updateClear(){
  const dirty = els.q.value || els.category.value || els.tag.value || els.sort.value;
  els.clear.classList.toggle('show', !!dirty);
}

let debounce;
els.q.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(refresh, 350); });
els.category.addEventListener('change', refresh);
els.tag.addEventListener('change', refresh);
els.sort.addEventListener('change', () => { updateClear(); load(); }); // sort current page client-side
els.clear.addEventListener('click', () => {
  els.q.value = ''; els.category.value = ''; els.tag.value = ''; els.sort.value = '';
  refresh();
});

load();
</script>
</body>
</html>
